[project]
name = "agentscope-cli"
version = "0.7.0"
description = "AgentScope experiment and quality-gate command line client"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.28,<1",
  "pyyaml>=6.0,<7",
]

[project.scripts]
agentscope = "agentscope_cli.main:entrypoint"

[dependency-groups]
dev = [
  "mypy>=1.14,<2",
  "pytest>=9.0.3,<10",
  "ruff>=0.9,<1",
  "types-pyyaml>=6.0,<7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentscope_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true

