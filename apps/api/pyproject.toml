[project]
name = "agentscope-api"
version = "0.11.0"
description = "AgentScope control-plane and telemetry API"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14,<2",
  "asyncpg>=0.30,<1",
  "argon2-cffi>=23.1,<26",
  "celery[redis]>=5.4,<6",
  "fastapi>=0.115,<1",
  "email-validator>=2.2,<3",
  "httpx>=0.28,<1",
  "pydantic-settings>=2.7,<3",
  "prometheus-client>=0.21,<1",
  "pyjwt>=2.10,<3",
  "python-json-logger>=3.2,<5",
  "python-multipart>=0.0.20,<1",
  "redis>=5.2,<7",
  "sqlalchemy[asyncio]>=2.0.36,<3",
  "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = [
  "aiosqlite>=0.20,<1",
  "mypy>=1.14,<2",
  "pytest>=9.0.3,<10",
  "pytest-asyncio>=0.25,<2",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentscope_api"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

