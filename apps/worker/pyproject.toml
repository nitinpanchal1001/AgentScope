[project]
name = "agentscope-worker"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "celery[redis]>=5.4,<6",
  "pydantic-settings>=2.7,<3",
  "python-json-logger>=3.2,<4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentscope_worker"]

