[project]
name = "agentscope-real-test-agents"
version = "1.0.0"
description = "Real OpenAI-backed specialist agents and a product delivery team for AgentScope"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.161,<1",
  "openai>=2.54,<3",
  "pydantic>=2.14,<3",
  "uvicorn[standard]>=0.54,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["real_agents", "agents"]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "mypy>=1.19,<2",
  "pytest>=9.0.3,<10",
  "ruff>=0.14,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true

