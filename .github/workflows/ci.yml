name: CI

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: agentscope
          POSTGRES_PASSWORD: agentscope
          POSTGRES_DB: agentscope
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U agentscope -d agentscope"
          --health-interval 5s --health-timeout 3s --health-retries 10
    defaults:
      run:
        working-directory: apps/api
    env:
      AGENTSCOPE_ENVIRONMENT: test
      AGENTSCOPE_DATABASE_URL: postgresql+asyncpg://agentscope:agentscope@localhost:5432/agentscope
      AGENTSCOPE_JWT_SECRET: ci-only-jwt-secret-with-at-least-32-characters
      AGENTSCOPE_TOKEN_HASH_SECRET: ci-only-hash-secret-with-at-least-32-characters
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
        with: { python-version: "3.12", enable-cache: true }
      - run: uv sync --all-groups --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src
      - run: uv run pytest --cov=agentscope_api --cov-report=term-missing
      - run: uv run alembic upgrade head
      - run: uv run alembic check

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --run
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  python-sdk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/python-sdk
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
        with: { python-version: "3.12", enable-cache: true }
      - run: uv sync --all-groups --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src
      - run: uv run pytest

  evaluation-engine:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/evaluation
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
        with: { python-version: "3.12", enable-cache: true }
      - run: uv sync --all-groups --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src tests
      - run: uv run pytest

  cli:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/cli
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
        with: { python-version: "3.12", enable-cache: true }
      - run: uv sync --all-groups --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src
      - run: uv run pytest

  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/worker
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
        with: { python-version: "3.12", enable-cache: true }
      - run: uv sync --all-groups --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src
      - run: uv run pytest

  python-dependency-audit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component:
          - apps/api
          - apps/worker
          - packages/python-sdk
          - packages/evaluation
          - packages/cli
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
        with: { python-version: "3.12", enable-cache: true }
      - run: uv sync --all-groups --frozen
        working-directory: ${{ matrix.component }}
      - run: uv run --with pip-audit pip-audit
        working-directory: ${{ matrix.component }}

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - run: npm ci
        working-directory: apps/web
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: docker compose up -d --build
      - run: curl --fail --retry 30 --retry-delay 2 --retry-all-errors http://localhost:8000/health/ready
      - run: curl --fail --retry 30 --retry-delay 2 --retry-all-errors http://localhost:3000
      - run: npm run e2e
        working-directory: apps/web
      - if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down --volumes

  container-build:
    runs-on: ubuntu-latest
    strategy:
      matrix: { image: [api, web, worker, demo-agent] }
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/${{ matrix.image }}.Dockerfile
          push: false
          tags: agentscope/${{ matrix.image }}:ci
