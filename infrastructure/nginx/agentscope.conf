limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=ingest:10m rate=120r/m;

upstream agentscope_api { server api:8000; keepalive 32; }
upstream agentscope_web { server web:3000; keepalive 16; }

server {
    listen 80;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name agentscope.example.com;
    ssl_certificate /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 12m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;

    location ~ ^/api/v1/auth/(login|register)$ {
        limit_req zone=auth burst=5 nodelay;
        proxy_pass http://agentscope_api;
    }
    location /v1/ingest/ {
        limit_req zone=ingest burst=60 nodelay;
        proxy_pass http://agentscope_api;
    }
    location /internal/ {
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
        proxy_pass http://agentscope_api;
    }
    location = /metrics {
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
        proxy_pass http://agentscope_api;
    }
    location ~ ^/(api/|health/) {
        proxy_pass http://agentscope_api;
    }
    location / {
        proxy_pass http://agentscope_web;
    }
}
